<!doctype html>
<html lang="zh_CN">
<head>
    <title>炜皓的网站</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="shortcut icon" href="/images/logo.webp" type="image/x-icon">
    <link rel="stylesheet" href="/css/main2.css>
    <noscript></noscript>
    <style>
        .vvv {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
        }
    </style>
</head>
<body class="is-preload">
    <div id="wrapper">
        <header id="header">
            <div class="logo">
                <img src="/images/logo.webp" class="logo">
            </div>
            <div class="content" id="content">
                <!-- 内容由JS动态生成 -->
            </div>
            <nav>
                <ul id="nav-links">
                    <!-- 导航链接由JS动态生成 -->
                </ul>
            </nav>
        </header>

        <footer id="footer">
            <p class="copyright">2022-2025: <a href="https://www.zwh233.top">ZWH</a></p>
        </footer>
    </div>

    <script>
        // 语言检测函数
        function getLanguage() {
            const lang = navigator.language || navigator.userLanguage;
            if (lang.includes('zh')) return 'zh_CN';
            if (lang.includes('ja')) return 'ja';
            return 'en';
        }

        // 内容初始化
        function initContent() {
            // 动态插入主要内容
            document.getElementById('content').innerHTML = `
                <div class="inner">
                    <h1>炜皓的网站</h1>
                    <p><br></p>
                    <p><a href="mailto:zwh@outlook.jp" class="mail-botton">zwh@outlook.jp</a></p>
                    <p><br></p>
                    <div>
                        <span style="color:#E53333;font-size:18px;">
                            <strong>请收藏本网站，本网站永久有效</strong>
                        </span>
                    </div>
                </div>
            `;

            // 动态插入导航链接
            document.getElementById('nav-links').innerHTML = `
                <li><a href="https://home.zwh233.top">正经介绍</a></li>
                <li><a href="https://blog.zwh233.top">我的博客</a></li>
                <li><a href="https://zwhweb.pages.dev" target="_blank">备用站点</a></li>
            `;

            // 设置语言
            const language = getLanguage();
            document.documentElement.lang = language;
            loadContent(language);
        }

        // 加载语言文件
        function loadContent(language) {
            const script = document.createElement('script');
            script.src = '/js/' + language + '.js';
            document.head.appendChild(script);
        }

        // DOM加载完成后初始化
        document.addEventListener('DOMContentLoaded', initContent);
    </script>

    <!-- 原有外链脚本 -->
    <script src="/js/jquery.min.js"></script>
    <script src="/js/browser.min.js"></script>
    <script src="/js/breakpoints.min.js"></script>
    <script src="/js/util.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
